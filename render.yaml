services:
  - type: web
    name: scorpio-octavious-vibe-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SOV_AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: TAPJOY_SECRET
        sync: false
      - key: TAPJOY_WEB_SDK_KEY
        sync: false
      - key: SOV_FEE_WALLET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
