
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>SOV Lite | Friends</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f8ff;font-family:Arial,sans-serif}
header{background:#101827;padding:16px;border-bottom:1px solid #25466a}
h1{margin:0;color:#36a5ff;font-size:23px}
main{max-width:620px;margin:auto;padding:15px}
.card{background:#111a29;border:1px solid #263e59;border-radius:14px;padding:15px;margin-bottom:14px}
input{width:100%;background:#080b12;color:white;border:1px solid #345071;border-radius:9px;padding:12px;margin:8px 0;font:inherit}
button{background:#087fe5;color:white;border:0;border-radius:9px;padding:10px 13px;margin:4px 3px 4px 0;font-weight:bold;cursor:pointer}
.secondary{background:#23344b}
.muted{color:#aab9cc;font-size:13px}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #26384f}
.person:last-child{border-bottom:0}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#203d5d;color:#63baff;font-weight:bold;font-size:20px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:bold;overflow-wrap:anywhere}
.actions{margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>🦂 SOV Lite</h1>
  <div class="muted">Friends & Followers</div>
  <nav>
    <button onclick="location.href='index.html'">Home Feed</button>
    <button onclick="location.href='profile.html'">Profile</button>
  </nav>
</header>

<main>
  <section class="card">
    <h2>Find people</h2>
    <input id="search" placeholder="Search by nickname..." maxlength="40">
    <p class="muted">Search the sample users below.</p>
  </section>

  <section class="card">
    <h2>People you may know</h2>
    <div id="people"></div>
  </section>

  <section class="card">
    <h2>Friend requests <span id="requestCount">(0)</span></h2>
    <div id="requests"></div>
  </section>

  <section class="card">
    <h2>My friends <span id="friendCount">(0)</span></h2>
    <div id="friends"></div>
  </section>

  <section class="card">
    <h2>Following <span id="followingCount">(0)</span></h2>
    <div id="following"></div>
  </section>

  <section class="card">
    <h2>Followers <span id="followerCount">(0)</span></h2>
    <div id="followers"></div>
    <p class="muted">Followers will appear here when real accounts follow you.</p>
  </section>

  <p id="status" class="muted">Friends page test mode.</p>
</main>

<script>
const users = [
  {id:1,name:"Scorpio Member"},
  {id:2,name:"Vibe Creator"},
  {id:3,name:"Blue Scorpio"},
  {id:4,name:"SOV Explorer"},
  {id:5,name:"Octavious Vibe"}
];

let requests = [];
let friends = [];
let following = [];
let followers = [];

const $ = id => document.getElementById(id);

function contains(list,id) {
  return list.some(user => user.id === id);
}

function makePerson(user, buttons=[]) {
  const row = document.createElement("div");
  row.className = "person";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = user.name.charAt(0).toUpperCase();
  row.appendChild(avatar);

  const info = document.createElement("div");
  info.className = "info";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = user.name;
  info.appendChild(name);

  buttons.forEach(item => {
    const button = document.createElement("button");
    button.textContent = item.label;
    if (item.secondary) button.className = "secondary";
    button.onclick = item.action;
    info.appendChild(button);
  });

  row.appendChild(info);
  return row;
}

function render() {
  const query = $("search").value.trim().toLowerCase();

  $("people").replaceChildren();
  users.filter(user =>
    user.name.toLowerCase().includes(query) &&
    !contains(friends,user.id)
  ).forEach(user => {
    const actions = [];

    actions.push({
      label: contains(requests,user.id) ? "Request sent" : "Add friend",
      secondary: contains(requests,user.id),
      action: () => {
        if (!contains(requests,user.id)) {
          requests.push(user);
          $("status").textContent = "Test friend request sent.";
          render();
        }
      }
    });

    actions.push({
      label: contains(following,user.id) ? "Following" : "Follow",
      secondary: contains(following,user.id),
      action: () => {
        if (contains(following,user.id)) {
          following = following.filter(u => u.id !== user.id);
        } else {
          following.push(user);
        }
        $("status").textContent = "Following list updated locally.";
        render();
      }
    });

    $("people").appendChild(makePerson(user,actions));
  });

  $("requests").replaceChildren();
  $("requestCount").textContent = `(${requests.length})`;
  if (!requests.length) $("requests").textContent = "No sent requests yet.";

  requests.forEach(user => {
    $("requests").appendChild(makePerson(user,[{
      label:"Cancel request",
      secondary:true,
      action:() => {
        requests = requests.filter(u => u.id !== user.id);
        render();
      }
    }]));
  });

  $("friends").replaceChildren();
  $("friendCount").textContent = `(${friends.length})`;
  if (!friends.length) $("friends").textContent = "No friends added yet.";

  friends.forEach(user => {
    $("friends").appendChild(makePerson(user,[{
      label:"Remove friend",
      secondary:true,
      action:() => {
        friends = friends.filter(u => u.id !== user.id);
        render();
      }
    }]));
  });

  $("following").replaceChildren();
  $("followingCount").textContent = `(${following.length})`;
  if (!following.length) $("following").textContent = "You're not following anyone yet.";

  following.forEach(user => {
    $("following").appendChild(makePerson(user,[{
      label:"Unfollow",
      secondary:true,
      action:() => {
        following = following.filter(u => u.id !== user.id);
        render();
      }
    }]));
  });

  $("followers").replaceChildren();
  $("followerCount").textContent = `(${followers.length})`;
  if (!followers.length) $("followers").textContent = "No followers yet.";

  followers.forEach(user => {
    $("followers").appendChild(makePerson(user));
  });
}

$("search").addEventListener("input",render);
render();
</script>
</body>
</html>
