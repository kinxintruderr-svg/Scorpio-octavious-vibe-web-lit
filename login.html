async function onGoogleCredential(response) {
  const status = document.getElementById('status');

  try {
    status.textContent = 'Verifying Google account with SOV…';

    const result = await SOV.api('/api/auth/google', {
      method: 'POST',
      body: { credential: response.credential }
    });

    if (!result || !result.access_token) {
      throw new Error('The SOV API did not return an access token.');
    }

    // Save the token in the same browser tab's session.
    sessionStorage.setItem('sov_access_token', result.access_token);

    // Verify that the token was saved before navigating.
    if (sessionStorage.getItem('sov_access_token') !== result.access_token) {
      throw new Error('Could not save the sign-in session.');
    }

    status.textContent = 'Signed in. Opening Home Feed…';
    window.location.replace('index.html');

  } catch (error) {

  }
