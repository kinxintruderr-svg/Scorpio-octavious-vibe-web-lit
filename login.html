
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>Sign In | Scorpio Octavious Vibe</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #102c62, #050914 60%);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border: 1px solid #173f79;
      border-radius: 20px;
      background: #0a1222;
      box-shadow: 0 15px 50px #0008;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 { font-size: 25px; margin: 0 0 10px; }
    p { color: #b9c8e2; line-height: 1.6; }

    .blue { color: #55a6ff; }

    #googleButton {
      display: flex;
      justify-content: center;
      min-height: 45px;
      margin: 24px auto 12px;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    a { color: #72b7ff; }

    .small {
      font-size: 12px;
      color: #91a3bf;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🦂</div>
    <h1>Welcome to <span class="blue">Scorpio Octavious Vibe</span></h1>
    <p>Sign in securely with your Google account to continue to SOV Lite.</p>

    <div id="googleButton"></div>
    <p id="status" role="status" aria-live="polite"></p>

    <p class="small">
      By continuing, you agree to follow the platform's terms and privacy policy.
    </p>
  </main>

  <script>
    "use strict";

    const API_BASE_URL =
      "https://scorpio-octavious-vibe-api.onrender.com";

    const GOOGLE_CLIENT_ID =
      "395329819255-0d9njnjr7v5d3orl3jatg993a7qgjtmi.apps.googleusercontent.com";

    const TOKEN_KEY = "sov_access_token";
    const USER_KEY = "sov_user";

    const statusElement = document.getElementById("status");
    const googleButton = document.getElementById("googleButton");

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function getSafeNextPage() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");

      // Only allow a local HTML page, never an external redirect.
      if (
        next &&
        /^[a-zA-Z0-9_-]+\.html$/.test(next) &&
        next !== "login.html"
      ) {
        return next;
      }

      return "index.html";
    }

    async function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        setStatus("Google did not return a sign-in credential.");
        return;
      }

      setStatus("Verifying your Google account securely…");
      googleButton.style.pointerEvents = "none";

      try {
        const result = await fetch(`${API_BASE_URL}/api/auth/google`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            credential: response.credential
          })
        });

        let data;

        try {
          data = await result.json();
        } catch {
          throw new Error("The server returned an invalid response.");
        }

        if (!result.ok) {
          throw new Error(
            data.error || data.message || "Google sign-in failed."
          );
        }

        if (!data.access_token) {
          throw new Error("The server did not return an access token.");
        }

        // Use the same storage and key as the other SOV Lite pages.
        sessionStorage.setItem(TOKEN_KEY, data.access_token);

        if (data.user) {
          sessionStorage.setItem(USER_KEY, JSON.stringify(data.user));
        }

        // Confirm that the backend accepts the new token before redirecting.
        const check = await fetch(`${API_BASE_URL}/api/me`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${data.access_token}`,
            "Accept": "application/json"
          }
        });

        if (!check.ok) {
  const details = await check.text();
  throw new Error(
    `Token verification failed (${check.status}): ${details.slice(0, 180)}`
  );
}
        const me = await check.json();

        if (me.user) {
          sessionStorage.setItem(USER_KEY, JSON.stringify(me.user));
        }

        window.location.replace(getSafeNextPage());

      } catch (error) {
        setStatus(error.message || "Unable to sign in. Please try again.");
        googleButton.style.pointerEvents = "auto";
      }
    }

    function initializeGoogleSignIn() {
      if (!window.google || !window.google.accounts) {
        setStatus("Loading Google Sign-In… Please wait.");
        setTimeout(initializeGoogleSignIn, 500);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      google.accounts.id.renderButton(googleButton, {
        type: "standard",
        theme: "filled_black",
        size: "large",
        text: "continue_with",
        shape: "rectangular",
        width: 280
      });
    }

    window.addEventListener("load", initializeGoogleSignIn);
  </script>
</body>
</html>
